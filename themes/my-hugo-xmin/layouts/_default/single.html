{{ partial "header.html" . }}

<div class="article-meta">
<h1 class="page-title">{{ .Title | markdownify }}</h1>
{{ with .Params.author }}<p class="author">{{ . }}</p>{{ end }}
{{ $date := default 0 .Params.date }}
{{ if (gt $date 0) }}<p class="date">{{ .Date.Format "January 2, 2006" }}</p>{{ end }}
</div>

<main>
{{ .Content }}
</main>

{{ partial "footer.html" . }}
